# Render 部署配置
# 北斗命數 MVP v3.0

services:
  - type: web
    name: beidou-mingshu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /api/info
    autoDeploy: true
