version: '3.8'

services:
  mingshu:
    build: .
    container_name: mingshu-api
    restart: unless-stopped
    ports:
      - "${MINGSHU_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - MINGSHU_SECRET_KEY=${MINGSHU_SECRET_KEY:-change-me-in-production}
      - MINGSHU_DB_PATH=/data/mingshu.db
    volumes:
      - mingshu-data:/data
      - mingshu-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mingshu-network

  nginx:
    image: nginx:alpine
    container_name: mingshu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mingshu
    networks:
      - mingshu-network

volumes:
  mingshu-data:
  mingshu-logs:

networks:
  mingshu-network:
    driver: bridge
