version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────
  # 北斗命數 API (統一入口)
  # ─────────────────────────────────────────────────────────────────
  beidou-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beidou-mingshu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Taipei
      - ENV=production
      - DEBUG=false
      - DB_PATH=/app/data/beidou_unified.db
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - ECPAY_SANDBOX=${ECPAY_SANDBOX:-true}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - beidou-network

networks:
  beidou-network:
    driver: bridge

volumes:
  beidou-data:
      start_period: 10s
    networks:
      - beidou-net

  # ─────────────────────────────────────────────────────────────────
  # Nginx 反向代理（可選）
  # ─────────────────────────────────────────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: beidou-nginx
